server:
  port: 8086

spring:
  application:
    name: custody-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veridian_custody}
    username: ${SPRING_DATASOURCE_USERNAME:veridian}
    password: ${SPRING_DATASOURCE_PASSWORD:veridian_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
